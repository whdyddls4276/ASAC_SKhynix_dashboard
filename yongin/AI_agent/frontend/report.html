<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>Field Health 불량 예측 보고서</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Malgun Gothic',sans-serif;background:#eef2f7;color:#1e293b;font-size:13px;height:100vh;overflow:hidden}

/* ── 헤더 ── */
.hdr{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;height:50px;flex-shrink:0}
.hdr-title{font-size:15px;font-weight:800}
.hdr-sub{font-size:11px;color:#93c5fd;margin-top:2px}
.hdr-meta{display:flex;align-items:center;gap:12px;font-size:11px;color:#bfdbfe}
.print-btn{background:#1d4ed8;color:#fff;border:none;border-radius:6px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer}
.print-btn:hover{background:#2563eb}

/* ── 메인 그리드 ── */
.body{display:grid;grid-template-columns:55% 45%;gap:10px;padding:10px;height:calc(100vh - 50px);overflow:hidden}

/* ── 왼쪽 ── */
.left{display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto}
.left-top{display:grid;grid-template-columns:185px 1fr;gap:10px;flex-shrink:0}

/* ── 오른쪽 ── */
.right{display:flex;flex-direction:column;gap:10px;min-height:0}
.right-top{flex:1;min-height:0;overflow:hidden}
.right-bottom{flex:1;min-height:0;overflow:hidden}

/* ── 카드 ── */
.card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);height:100%;display:flex;flex-direction:column}
.ct{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;flex-shrink:0}
.chart-wrap{flex:1;min-height:0;position:relative}

/* ── 모델 결과 KPI ── */
.kpi-col{display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1;min-height:0}
.kpi{background:#f8fafc;border-radius:7px;padding:5px 9px;border:1px solid #e2e8f0;flex-shrink:0}
.kpi .v{font-size:14px;font-weight:800;line-height:1}
.kpi .l{font-size:9px;color:#94a3b8;margin-top:1px}
.kpi.red .v{color:#dc2626}.kpi.amber .v{color:#d97706}.kpi.green .v{color:#16a34a}.kpi.blue .v{color:#1d4ed8}
.badge{display:inline-block;border-radius:3px;padding:1px 5px;font-size:9px;font-weight:700}
.b-red{background:#fee2e2;color:#dc2626}.b-amber{background:#fef3c7;color:#b45309}
.b-blue{background:#dbeafe;color:#1d4ed8}.b-green{background:#dcfce7;color:#15803d}

/* ── SHAP 섹션 ── */
.shap-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.shap-feat{width:90px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.shap-bar-wrap{flex:1;position:relative;height:14px;background:#f1f5f9;border-radius:3px}
.shap-bar{position:absolute;top:2px;height:10px;border-radius:2px}
.shap-val{width:40px;font-size:10px;color:#64748b;text-align:right;flex-shrink:0}
.shap-zero{position:absolute;top:0;height:100%;width:1px;background:#94a3b8}

/* ── 피처 임포턴스 ── */
.imp-row{display:flex;align-items:center;gap:6px;padding:2px 3px;border-radius:3px;cursor:pointer}
.imp-row:hover{background:#f8fafc}
.imp-row.hl{background:#eff6ff}
.imp-name{width:95px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-bar-wrap{flex:1;background:#f1f5f9;border-radius:3px;height:6px}
.imp-bar{height:6px;border-radius:3px;background:linear-gradient(90deg,#3b82f6,#6366f1)}
.imp-val{width:28px;font-size:10px;color:#64748b;text-align:right}

/* ── 불량/정상 차이 ── */
.diff-feat{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #f1f5f9}
.diff-feat:last-child{border:none;margin-bottom:0}
.diff-feat-name{font-size:11px;font-weight:700;color:#374151;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.bp-wrap{position:relative;height:22px;background:#f1f5f9;border-radius:3px;margin-bottom:2px}
.bp-iqr{position:absolute;top:20%;height:60%;border-radius:2px;opacity:.8}
.bp-med{position:absolute;top:5%;height:90%;width:2px;background:#fff}
.bp-wsk{position:absolute;top:46%;height:2px}
.diff-stats{display:flex;justify-content:space-between;font-size:9px;color:#94a3b8}

/* ── 개선방안 ── */
.sol-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;flex-shrink:0}
.sol-tab{padding:4px 11px;border-radius:15px;font-size:11px;font-weight:600;cursor:pointer;border:none;background:#f1f5f9;color:#475569;transition:.12s}
.sol-tab.active{background:#1d4ed8;color:#fff}
.sol-body{flex:1;overflow-y:auto;min-height:0}
.sol-num{font-size:20px;font-weight:800}
.sol-num.red{color:#dc2626}.sol-num.green{color:#16a34a}
.rec-box{background:#eff6ff;border-radius:7px;padding:8px 12px;font-size:11px;color:#1e40af;line-height:1.7;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:11px}
td{padding:4px 6px;border-bottom:1px solid #f8fafc}
td:first-child{color:#64748b}

.loading{display:flex;align-items:center;justify-content:center;height:100%;font-size:15px;color:#94a3b8}
@media print{.print-btn{display:none}.body{height:auto;overflow:visible}.left,.right{overflow:visible}}
</style>
</head>
<body>
<div id="root"><div class="loading">데이터 로딩 중...</div></div>
<script>
// ── 전역 차트 인스턴스
const charts = {};
let DATA = null, selFeat = 0;
const C = { high:'#ef4444', low:'#22c55e', blue:'#3b82f6', amber:'#f59e0b', gray:'#94a3b8' };
const fmt = (v,d=4) => v==null?'—':Number(v).toFixed(d);
const today = new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});

function destroyChart(id){ if(charts[id]){charts[id].destroy();delete charts[id];} }

// ═══════════════════════════════════════════════════════════
function render(d) {
  DATA = d;
  const p = d.perf;

  document.getElementById('root').innerHTML = `
  <div class="hdr">
    <div>
      <div class="hdr-title">SK Hynix · Wafer Test Field Health 불량 예측 보고서</div>
      <div class="hdr-sub">Study: ${p.study_id} &nbsp;·&nbsp; Two-Stage Model &nbsp;·&nbsp; y_pred 기준 위험 분류 (HIGH≥${p.high_thr} / LOW&lt;${p.low_thr})</div>
    </div>
    <div class="hdr-meta">
      <span>${today}</span>
      <button class="print-btn" onclick="window.print()">인쇄 / PDF</button>
    </div>
  </div>

  <div class="body">
    <!-- ══ 왼쪽 ══ -->
    <div class="left">

      <!-- Row1: 모델결과 + 트렌드 -->
      <div class="left-top" style="height:215px">

        <!-- 모델 결과 -->
        <div class="card">
          <div class="ct">모델 결과 요약</div>
          <div class="kpi-col">
            <div class="kpi ${p.val_rmse<0.006?'green':'amber'}">
              <div class="v">${fmt(p.val_rmse,6)}</div>
              <div class="l">Val RMSE</div>
            </div>
            <div class="kpi blue">
              <div class="v">${fmt(p.test_rmse,6)}</div>
              <div class="l">Test RMSE</div>
            </div>
            <div class="kpi red">
              <div class="v">${p.n_high.toLocaleString()}</div>
              <div class="l">고위험 유닛</div>
            </div>
            <div class="kpi amber">
              <div class="v">${(p.precision_pred*100).toFixed(1)}%</div>
              <div class="l">예측 적중률</div>
            </div>
            <div class="kpi">
              <div class="v">${(p.n_nonzero/p.n_val*100).toFixed(1)}%</div>
              <div class="l">실제 불량률</div>
            </div>
          </div>
        </div>

        <!-- 트렌드 -->
        <div class="card">
          <div class="ct">
            로트별 예측 health 트렌드 (75일 — Train ${p.train_days}일 / Val ${p.val_days}일 / Test ${p.test_days}일)
          </div>
          <div class="chart-wrap"><canvas id="c-trend"></canvas></div>
        </div>
      </div>

      <!-- Row2: SHAP -->
      <div class="card" style="height:175px">
        <div class="ct">SHAP 분석 결과 — 피처별 고위험 기여 방향 (표준화된 중앙값 차이)</div>
        <div id="shap-body" style="flex:1;overflow-y:auto"></div>
      </div>

      <!-- Row3: 피처 임포턴스 -->
      <div class="card" style="flex:1;min-height:120px">
        <div class="ct">피처 임포턴스 Top 15 &nbsp;<span style="font-size:9px;color:#94a3b8">(파란 배경 = 상세 분석 가능, 클릭 시 개선방안 갱신)</span></div>
        <div id="imp-body" style="flex:1;overflow-y:auto"></div>
      </div>
    </div>

    <!-- ══ 오른쪽 ══ -->
    <div class="right">

      <!-- 불량/정상 차이 -->
      <div class="right-top">
        <div class="card">
          <div class="ct">불량 / 정상 차이 — 고위험(y_pred≥${p.high_thr}) vs 저위험(y_pred&lt;${p.low_thr}) 피처 분포</div>
          <div id="diff-body" style="flex:1;overflow-y:auto"></div>
        </div>
      </div>

      <!-- 개선방안 -->
      <div class="right-bottom">
        <div class="card">
          <div class="ct">개선방안</div>
          <div class="sol-tabs" id="sol-tabs"></div>
          <div class="sol-body" id="sol-body"></div>
        </div>
      </div>
    </div>
  </div>`;

  buildShap(d.shap_data);
  buildImpList(d.importance_all, d.feature_comparison);
  buildDiffSection(d.feature_comparison);
  buildSolTabs(d.feature_comparison);
  buildSolBody(d.feature_comparison[selFeat]);
  drawTrend(d.trend_data, d.perf);
}

// ── SHAP 섹션 ──────────────────────────────────────────────────────────────
function buildShap(shap_data) {
  const sorted = [...shap_data].sort((a,b)=>Math.abs(b.effect_norm)-Math.abs(a.effect_norm));
  const maxAbs = Math.max(...sorted.map(s=>Math.abs(s.effect_norm))) || 1;

  let html = '';
  sorted.forEach(s => {
    const pct = (Math.abs(s.effect_norm) / maxAbs * 45).toFixed(1);
    const isPos = s.effect_norm >= 0;
    const color = isPos ? C.high : C.blue;
    const dir = isPos ? '↑ 고위험 시 높음' : '↓ 고위험 시 낮음';
    // 중앙선 위치 = 50%
    const barLeft = isPos ? '50%' : `${(50 - parseFloat(pct)).toFixed(1)}%`;
    html += `<div class="shap-row">
      <div class="shap-feat" title="${s.feature}">${s.feature}</div>
      <div class="shap-bar-wrap">
        <div class="shap-zero" style="left:50%"></div>
        <div class="shap-bar" style="left:${barLeft};width:${pct}%;background:${color}"></div>
      </div>
      <div class="shap-val" style="color:${color}">${s.effect_norm>0?'+':''}${s.effect_norm.toFixed(3)}</div>
      <div style="font-size:9px;color:${color};width:80px;flex-shrink:0">${dir}</div>
    </div>`;
  });
  document.getElementById('shap-body').innerHTML = html;
}

// ── 피처 임포턴스 ──────────────────────────────────────────────────────────
function buildImpList(imp_all, fc) {
  const fcNames = new Set(fc.map(f=>f.feature));
  const maxImp = imp_all[0].importance;
  document.getElementById('imp-body').innerHTML = imp_all.map((f,i) => `
    <div class="imp-row ${fcNames.has(f.feature)?'hl':''}" onclick="onFeatClick('${f.feature}')">
      <div style="width:14px;font-size:9px;color:#94a3b8">${i+1}</div>
      <div class="imp-name">${f.feature}</div>
      <div class="imp-bar-wrap"><div class="imp-bar" style="width:${(f.importance/maxImp*100).toFixed(1)}%"></div></div>
      <div class="imp-val">${f.importance}</div>
    </div>`).join('');
}

// ── 불량/정상 차이 섹션 ──────────────────────────────────────────────────────
function buildDiffSection(fc) {
  let html = '';
  fc.forEach(feat => {
    const {feature, agg, high_box, low_box, normal_lo, normal_hi,
           high_median, normal_median, corr_ypred} = feat;
    const all = [...high_box, ...low_box, normal_lo, normal_hi];
    const minV = Math.min(...all), maxV = Math.max(...all);
    const rng = maxV - minV || 1;
    const p = v => ((v-minV)/rng*100).toFixed(1)+'%';
    const w = (a,b) => Math.max(0,(b-a)/rng*100).toFixed(1)+'%';

    const diffAbs = Math.abs(high_median - normal_median);
    const diffDir = high_median > normal_median ? '▲' : '▼';
    const [hq0,hq10,hq25,hq50,hq75,hq90,hq100] = high_box;
    const [lq0,lq10,lq25,lq50,lq75,lq90,lq100] = low_box;

    const bpRow = (d, color, lbl) => {
      const [q0,q10,q25,q50,q75,q90,q100]=d;
      return `<div style="display:flex;align-items:center;gap:5px;margin-bottom:3px">
        <div style="width:26px;font-size:9px;color:${color};font-weight:700">${lbl}</div>
        <div class="bp-wrap" style="flex:1">
          <div class="bp-iqr" style="left:${p(q25)};width:${w(q25,q75)};background:${color}"></div>
          <div class="bp-med" style="left:${p(q50)}"></div>
          <div class="bp-wsk" style="left:${p(q10)};width:${w(q10,q25)};background:${color}"></div>
          <div class="bp-wsk" style="left:${p(q75)};width:${w(q75,q90)};background:${color}"></div>
        </div>
        <div style="font-size:9px;color:#94a3b8;width:55px;text-align:right">
          Med: ${fmt(q50,4)}
        </div>
      </div>`;
    };

    html += `<div class="diff-feat">
      <div class="diff-feat-name">
        <span style="background:#eff6ff;color:#1d4ed8;border-radius:4px;padding:1px 7px;font-size:11px">${feature}</span>
        <span style="font-size:10px;color:#64748b">${agg} 집계</span>
        <span style="font-size:10px;color:${Math.abs(corr_ypred)>0.01?C.high:'#94a3b8'}">&nbsp;r(y_pred)=${corr_ypred>=0?'+':''}${corr_ypred}</span>
        <span style="margin-left:auto;font-size:10px;color:${high_median>normal_median?C.high:C.blue};font-weight:700">
          ${diffDir} Δ${diffAbs.toFixed(4)}
        </span>
      </div>
      ${bpRow(high_box, C.high, '고위험')}
      ${bpRow(low_box,  C.low,  '저위험')}
      <div style="font-size:9px;color:#64748b;margin-top:2px">정상 범위: <b>${normal_lo}</b> ~ <b>${normal_hi}</b></div>
    </div>`;
  });
  document.getElementById('diff-body').innerHTML = html;
}

// ── 개선방안 탭 ────────────────────────────────────────────────────────────
function buildSolTabs(fc) {
  document.getElementById('sol-tabs').innerHTML = fc.map((f,i)=>`
    <button class="sol-tab ${i===selFeat?'active':''}" onclick="selectFeat(${i})">${f.feature}</button>`).join('');
}
function buildSolBody(feat) {
  if(!feat) return;
  const {feature,agg,high_median,normal_median,normal_lo,normal_hi,sim,pos_compare,corr_ypred} = feat;
  const improved = sim.new_pred_est < sim.current_pred_median;
  const aggTips = {
    mean:'웨이퍼 내 평균값 이탈 → 공정 전반 조건 점검',
    std:'die 간 편차 과다 → 균일도 개선, 공정 안정화',
    range:'max-min 범위 과다 → 특정 die 이상 거동 점검',
    min:'최솟값 이탈 → 하위 die 개별 점검',
    max:'최댓값 이탈 → 상위 die 개별 점검',
    median:'중앙값 이탈 → 공정 기준값 재조정',
    cv:'변동계수 과다 → die 간 상대 편차, 균일성 개선',
  };
  const tip = aggTips[agg] || '공정 조건 점검';

  document.getElementById('sol-body').innerHTML = `
    <!-- Row 1: 수치 테이블 + 예상 변화 (가로 2열, 컴팩트) -->
    <div style="display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:7px">
      <table>
        <tr><td>고위험 중앙값</td><td><b style="color:${C.high}">${high_median}</b></td></tr>
        <tr><td>목표 (저위험 중앙값)</td><td><b style="color:${C.low}">${normal_median}</b></td></tr>
        <tr><td>정상 범위</td><td><b>${normal_lo} ~ ${normal_hi}</b></td></tr>
        <tr><td>조정량</td><td><b>${sim.delta_feat>=0?'+':''}${sim.delta_feat}</b></td></tr>
      </table>
      <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:7px;padding:6px 10px;white-space:nowrap;display:flex;flex-direction:column;justify-content:center;gap:3px">
        <div style="font-size:9px;font-weight:700;color:#15803d">예상 y_pred 변화</div>
        <div style="display:flex;gap:8px;align-items:center">
          <div><div style="font-size:9px;color:#94a3b8">현재</div><div class="sol-num red" style="font-size:15px">${sim.current_pred_median}</div></div>
          <div style="font-size:14px">→</div>
          <div><div style="font-size:9px;color:#94a3b8">조정 후</div><div class="sol-num ${improved?'green':'red'}" style="font-size:15px">${sim.new_pred_est}</div></div>
        </div>
        <div style="font-size:9px;color:#15803d">Δ <b>${sim.delta_pred>=0?'+':''}${sim.delta_pred}</b> ${improved?'↓ 개선':'변화 미미'}</div>
      </div>
    </div>
    <!-- Row 2: y_pred 분포 변화 차트 (낮은 높이) -->
    <div style="font-size:10px;font-weight:700;color:#374151;margin-bottom:3px">y_pred 분포 변화 <span style="font-size:9px;color:#94a3b8;font-weight:400">빨강: 현재 · 초록: 조정 후</span></div>
    <div style="height:80px;position:relative"><canvas id="c-sim"></canvas></div>
    <!-- Row 3: 권고 (1줄 요약) -->
    <div style="background:#eff6ff;border-radius:6px;padding:6px 10px;font-size:10px;color:#1e40af;margin-top:7px;line-height:1.6">
      <b>권고</b> — <b>${feature}</b>(${agg}): 중앙값 ${high_median} → 정상범위 ${normal_lo}~${normal_hi} &nbsp;|&nbsp; ${tip}
      <span style="color:#6b7280"> · r≈${Math.abs(corr_ypred).toFixed(4)}</span>
    </div>`;

  drawSim(sim);
  drawPos(pos_compare);
}

function onFeatClick(name){
  const idx=DATA.feature_comparison.findIndex(x=>x.feature===name);
  if(idx>=0) selectFeat(idx);
}
function selectFeat(idx){
  selFeat=idx;
  buildSolTabs(DATA.feature_comparison);
  buildSolBody(DATA.feature_comparison[idx]);
  buildImpList(DATA.importance_all, DATA.feature_comparison);
}

// ── 트렌드 차트 ────────────────────────────────────────────────────────────
function drawTrend(trend_data, perf) {
  destroyChart('trend');
  const ctx = document.getElementById('c-trend').getContext('2d');
  const days      = trend_data.map(d=>d.day);
  const pred_vals = trend_data.map(d=>d.avg_pred);
  const true_vals = trend_data.map(d=>d.avg_true);  // null for val/test

  const TD = perf.train_days;
  const VD = perf.train_days + perf.val_days;

  // 배경 밴드 플러그인
  const bandPlugin = {
    id:'bands',
    beforeDraw(chart){
      const {ctx:c, scales:{x,y}, chartArea:{top,bottom}} = chart;
      const bands=[
        {lo:1,         hi:TD,    color:'rgba(59,130,246,0.06)',  lbl:'Train'},
        {lo:TD+1,      hi:VD,    color:'rgba(245,158,11,0.08)',  lbl:'Val'},
        {lo:VD+1,      hi:75,    color:'rgba(239,68,68,0.07)',   lbl:'Test'},
      ];
      c.save();
      bands.forEach(b=>{
        const x1=x.getPixelForValue(b.lo), x2=x.getPixelForValue(b.hi);
        c.fillStyle=b.color;
        c.fillRect(x1,top,x2-x1,bottom-top);
        c.fillStyle='rgba(100,116,139,0.6)';
        c.font='bold 9px Segoe UI';
        c.fillText(b.lbl, x1+4, top+10);
      });
      // 구분선
      [TD+0.5, VD+0.5].forEach(v=>{
        const xv=x.getPixelForValue(v);
        c.strokeStyle='rgba(100,116,139,0.4)'; c.lineWidth=1;
        c.setLineDash([3,3]);
        c.beginPath(); c.moveTo(xv,top); c.lineTo(xv,bottom); c.stroke();
      });
      // 고위험 임계선
      const yThr=y.getPixelForValue(perf.high_thr);
      c.strokeStyle=C.high; c.lineWidth=1; c.setLineDash([4,2]);
      c.beginPath(); c.moveTo(chart.chartArea.left,yThr); c.lineTo(chart.chartArea.right,yThr); c.stroke();
      c.fillStyle=C.high; c.font='9px Segoe UI'; c.setLineDash([]);
      c.fillText(`고위험 임계(${perf.high_thr})`, chart.chartArea.left+4, yThr-3);
      c.restore();
    }
  };
  charts['trend'] = new Chart(ctx, {
    type:'line',
    plugins: [bandPlugin],
    data:{
      labels: days,
      datasets:[
        {
          label:'y_true (실제 health)',
          data: true_vals,
          borderColor: C.low,
          backgroundColor: C.low+'44',
          borderWidth: 1.5,
          fill: 'origin',
          pointRadius: 2,
          tension: 0.35,
          spanGaps: false,  // null 구간은 그리지 않음 → val/test 영역 자동 제외
          order: 2,
        },
        {
          label:'y_pred (예측 health)',
          data: pred_vals,
          borderColor: C.blue,
          backgroundColor: 'transparent',
          borderWidth: 2,
          pointRadius: 2,
          tension: 0.3,
          fill: false,
          order: 1,
        },
      ]
    },
    options:{
      animation:false,
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{
          display:true,
          labels:{font:{size:10}, boxWidth:12, padding:8}
        },
        tooltip:{
          callbacks:{
            title: items => `Day ${items[0].label}`,
            label: item => `${item.dataset.label}: ${item.raw?.toFixed(6) ?? '—'}`,
          }
        }
      },
      scales:{
        x:{
          ticks:{font:{size:9}, maxTicksLimit:15},
          title:{display:true, text:'Day', font:{size:9}},
        },
        y:{
          ticks:{font:{size:9}},
          title:{display:true, text:'health (y)', font:{size:9}},
        }
      }
    }
  });
}

// ── 시뮬레이션 히스토그램 ────────────────────────────────────────────────────
function drawSim(sim){
  destroyChart('sim');
  const el=document.getElementById('c-sim'); if(!el) return;
  const bins=8;
  const allVals=[...sim.current_pred_dist,...sim.simulated_pred_dist];
  const lo=Math.min(...allVals), hiR=Math.max(...allVals);
  const hi=hiR===lo?lo+0.001:hiR;
  const step=(hi-lo)/bins;
  const labels=[],curr=Array(bins).fill(0),adj=Array(bins).fill(0);
  for(let i=0;i<bins;i++) labels.push((lo+i*step).toFixed(5));
  sim.current_pred_dist.forEach(v=>{const i=Math.min(Math.floor((v-lo)/step),bins-1);if(i>=0)curr[i]++;});
  sim.simulated_pred_dist.forEach(v=>{const i=Math.min(Math.floor((v-lo)/step),bins-1);if(i>=0)adj[i]++;});
  charts['sim']=new Chart(el.getContext('2d'),{
    type:'bar',
    data:{labels,datasets:[
      {label:'현재',  data:curr, backgroundColor:C.high+'99', borderRadius:2},
      {label:'조정후', data:adj,  backgroundColor:C.low+'99',  borderRadius:2},
    ]},
    options:{animation:false,responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{font:{size:8},maxTicksLimit:6},title:{display:false}},
        y:{ticks:{font:{size:8},maxTicksLimit:4},grid:{display:false}}
      }
    }
  });
}
